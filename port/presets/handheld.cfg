-- RECry engine settings for handhelds (written as System.Cfg / system.cfg).
-- Tuned and measured on the Allwinner H700 (Mali-G31 MP2) at 640x480: all 20
-- levels hold the 30 FPS cap with the launcher's Auto options. run.sh applies
-- this file over the engine's saved config at every start, then the launcher's
-- choices (resolution, frame limit, the physics/effects/view trade-offs).
--
-- Values must stay double-quoted: the engine's config parser ignores
-- unquoted values. This file documents every deliberate quality compromise
-- and the cvars that were remapped because they do not exist in Far Cry 1.

-- ---------------------------------------------------------------------------
-- Display
-- ---------------------------------------------------------------------------
-- COMPROMISE: native panel resolution instead of upscaled 1280x720/1080p.
-- 640x480 is the lowest supported Far Cry 1 mode and the target output size.
r_Width = "640"
r_Height = "480"
-- KMSDRM device runs take the full display; on an X11 dev host set this to "0".
r_Fullscreen = "1"
-- The GLES backend requests 32/24/8 color/depth/stencil through SDL attributes;
-- these cvars document intent only (see header).
r_ColorBits = "32"
r_DepthBits = "24"
r_StencilBits = "8"
-- SDL applies this requested swap interval; inspect the effective driver value.
-- CPU pacing below requests a 30 FPS ceiling independently of swap interval.
r_VSync = "0"

-- ---------------------------------------------------------------------------
-- Shaders
-- ---------------------------------------------------------------------------
-- The Far Cry 1 GLES backend compiles its GLSL ES program(s) at renderer init
-- and has no dynamic-branching/async-compile/preactivate path. The Crysis-era
-- cvars r_ShadersDynamicBranching, r_ShadersAsyncCompiling and
-- r_ShadersPreactivate do not exist in this engine and were removed from the
-- active preset (they only produced "Lua cvar:" warnings when quoted).

-- ---------------------------------------------------------------------------
-- Vegetation
-- ---------------------------------------------------------------------------
-- COMPROMISE: distant vegetation becomes flat sprites instead of 3D geometry.
e_vegetation_sprites = "1"
-- COMPROMISE: cull vegetation whose radius is below 2 world units
-- (engine default is 0 = keep everything).
e_vegetation_min_size = "2"
-- Distance at which vegetation becomes batched sprites (1.0 = Far Cry
-- default, lower = sooner). Measured on the H700 (River outdoor bench,
-- 2026-11-10): 1.5 -> 32.7 FPS / 712 draws, 1.0 -> 37.4 / 474, 0.8 -> 38.6 /
-- 426, with no visible difference; the port keeps anything closer than 18 m
-- in 3D regardless (FARCRY_SPRITE_MIN_DIST).
e_vegetation_sprites_distance_ratio = "0.8"
-- e_vegetation_static_instancing does not exist in Far Cry 1; the GLES backend
-- has no instancing path, so the key was removed instead of silently ignored.

-- ---------------------------------------------------------------------------
-- Detail objects, shadows, water
-- ---------------------------------------------------------------------------
-- COMPROMISE: no small detail objects (rocks/grass props): fewer draw calls and
-- less geometry, visibly sparser ground clutter.
-- e_detail_objects: stock (on). "0" renders grass as dark opaque shapes on this renderer; keep on.
-- COMPROMISE: no dynamic shadows at all. Real Far Cry 1 switches are
-- e_shadow_maps / e_stencil_shadows (the preset's old e_shadows key does not
-- exist). The GLES backend does not implement either path yet, so this mainly
-- avoids loading shadow resources.
e_shadow_maps = "0"
e_stencil_shadows = "0"

-- ---------------------------------------------------------------------------
-- Particles
-- ---------------------------------------------------------------------------
-- COMPROMISE: particle emitter rate/count halved (cvar contract: 1 = full LOD,
-- 0.5 = frequency and count scaled down twice). The old value 0 is outside the
-- documented meaning and divides the spawn period by 0.01, effectively
-- freezing emitters; 0.5 is the safe aggressive setting.
-- COMPROMISE: at most 500 live particles instead of the 2048 default.

-- ---------------------------------------------------------------------------
-- View distance and LOD
-- ---------------------------------------------------------------------------
-- Replaces e_view_dist_ratio = 0.65 (Crysis cvar, does not exist here). The Far
-- Cry 1 equivalent is e_obj_view_dist_ratio (default 55); 0.65*55 ~= 36.
-- COMPROMISE: objects/vegetation fade out ~35% closer than default.
-- Replaces e_lod_ratio = 1.4 (Crysis cvar, does not exist here):
--  * e_obj_lod_ratio (default 10) divides the LOD distance; lower = coarser
--    object LOD. 7 is a moderate step down.
--  * e_terrain_lod_ratio (default 1) scales heightmap LOD error; higher =
--    coarser terrain mesh.
-- Both mappings are approximate and unverified on hardware.
e_obj_lod_ratio = "7"
e_terrain_lod_ratio = "1.4"

-- ---------------------------------------------------------------------------
-- Textures / streaming
-- ---------------------------------------------------------------------------
-- COMPROMISE: keep textures resident instead of streaming: trades RAM for
-- steadier frame pacing (streaming caused frame-time spikes).
r_TexturesStreaming = "0"

-- ---------------------------------------------------------------------------
-- Frame pacing
-- ---------------------------------------------------------------------------
-- Frame cap (the launcher's Frame limit overrides it); 0 = uncapped.
g_maxfps = "30"
-- PortMaster run.sh also defaults to a two-frame GPU queue, 22.05 kHz audio,
-- mono positional samples (stereo output/panning retained), authored world DDS
-- mips capped at 256 where available, and two glibc allocation arenas.
-- Terrain detail layers per sector need pixel-shader GPUs; on this fixed-function
-- (GeForce2-class) path the engine itself uses 0. A saved 1 drew square patches.
e_detail_texture_quality = "0"

-- Handheld reductions (formerly the launcher's Physics / Effects / View rows).
-- This preset is the single game config: it is written once (first start,
-- port update, or "Restore default game settings" in the launcher); after
-- that the in-game Options menu owns these values and they are kept.
-- Effects: fewer particles and decals, no birds/fish flocks, no cloth.
e_particles_lod = "0.25"
e_particles_max_count = "120"
e_decals_life_time_scale = "0.5"
ca_EnableDecals = "0"
e_flocks = "0"
es_EnableCloth = "0"
cl_weapon_fx = "1"
r_EnvTexUpdateInterval = "0.1" -- reflections re-render the scene at 10 Hz
-- View: shorter object view distance; coarser terrain occlusion.
e_obj_view_dist_ratio = "36"
e_terrain_occlusion_culling_precision = "0.3"
-- Materials (native renderer): bump/specular materials through the game's
-- shader programs, and water reflections. Measured on the pier timedemo:
-- H700 38.3 -> 34.7 FPS, RG DS 39.1 -> 34.6 FPS (min FPS unchanged).
r_Quality_BumpMapping = "2"
