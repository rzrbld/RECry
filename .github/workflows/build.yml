name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aarch64:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    steps:
      - name: Host packages
        run: |
          dpkg --add-architecture arm64
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git make cmake bzip2 xz-utils zip file \
            libsdl2-dev:arm64 libsdl2-ttf-dev:arm64

      - uses: actions/checkout@v4

      - name: Cache toolchain and FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            .deps
            build/ffmpeg/out
          key: deps-${{ hashFiles('tools/build.sh') }}

      - name: Build
        run: tools/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: recry-aarch64
          path: dist/recry.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/recry.zip
          generate_release_notes: true
